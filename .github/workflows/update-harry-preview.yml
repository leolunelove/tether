name: Update Harry preview
on:
  push:
    branches: [main]
    paths: [.github/workflows/update-harry-preview.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source version
        run: test "$(git hash-object app/page.tsx)" = '25ded2b4bc0737f4bc20af9e4f00c9c5a674ff37'
      - name: Prepare sample voice
        run: npm install --prefix "$RUNNER_TEMP/tether-voice" --no-save --ignore-scripts --no-audit --no-fund mespeak@2.0.2
      - name: Record Harry's sample
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const base = process.env.RUNNER_TEMP + '/tether-voice/node_modules/mespeak';
          const speech = require(base + '/src/index.js');
          speech.loadConfig(require(base + '/src/mespeak_config.json'));
          speech.loadVoice(require(base + '/voices/en/en-us.json'));
          const text = "Daisy, Daisy, give me your answer do! I'm half crazy, all for the love of you!";
          const wav = speech.speak(text, {rawdata:'buffer', speed:145, pitch:45, amplitude:80});
          if (!wav || wav.length < 5000) throw new Error('No voice generated');
          fs.writeFileSync('public/demo-harry.wav', wav);
          NODE
      - name: Update preview name and duration
        run: |
          python3 <<'PY'
          from pathlib import Path
          import wave
          with wave.open('public/demo-harry.wav') as audio:
              duration = audio.getnframes() / audio.getframerate()
          page = Path('app/page.tsx')
          source = page.read_text()
          assert source.count('9.585805') == 2
          source = source.replace('Alex', 'Harry').replace('ALEX', 'HARRY').replace('demo-alex.wav', 'demo-harry.wav').replace('9.585805', f'{duration:.6f}')
          page.write_text(source)
          Path('public/demo-alex.wav').unlink()
          print(f'Harry sample: {duration:.6f} seconds')
          PY
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build:pages
      - name: Publish updated preview files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx public/demo-alex.wav public/demo-harry.wav docs
          git commit -m "Replace Alex with Harry and update the sample voice"
          git push origin HEAD:main
