name: Publish calmer Tether screens
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-calm-screens.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify previous interface
        run: test "$(git hash-object app/page.tsx)" = '19873ddf5546960f4f42e67e9d77e2a467730625'
      - name: Apply reviewed screens
        env:
          SOURCE_ARCHIVE: 
        run: |
          printf '%s' "$SOURCE_ARCHIVE" | base64 -d > "$RUNNER_TEMP/tether-screens.tar.gz"
          echo 'bff3d333509bce590317833d4ece8e16099fe6463ae7ea64bb5f5473e9e2f823  '"$RUNNER_TEMP/tether-screens.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/tether-screens.tar.gz"
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build:pages
      - name: Publish welcome and conversation screens
        run: |
          git config user.name 'Leo Lune'
          git config user.email '258829717+leolunelove@users.noreply.github.com'
          git add app README.md docs
          git commit -m 'Refine welcome flow and simplify the shared conversation'
          git push origin HEAD:main
