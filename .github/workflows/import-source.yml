name: Organize Tether documentation
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-source.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the reviewed documentation
        run: |
          test "$(git rev-parse HEAD:README.md)" = "75c51cf93c92f5956f960c409fd0faafe46f7f82"
          python3 - <<'PY'
          import base64, io, zipfile
          payload = ''
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(payload))) as archive:
              assert set(archive.namelist()) == {'README.md', 'guides/development.md', 'guides/publishing.md', '.gitattributes', '.gitignore'}
              assert archive.testzip() is None
              archive.extractall('.')
          PY
      - name: Commit the organized repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch tether-source.zip
          git add README.md guides .gitattributes .gitignore
          git commit -m 'Organize Tether documentation and repository'
          git push origin HEAD:main
