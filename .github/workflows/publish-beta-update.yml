name: Publish Tether beta update
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-beta-update.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify previous interface
        run: test "$(git hash-object app/page.tsx)" = '9dee411c3ed986b972a0d1fedd3c66472461152b'
      - name: Apply reviewed source
        env:
          SOURCE_ARCHIVE: 
        run: |
          printf '%s' "$SOURCE_ARCHIVE" | base64 -d > "$RUNNER_TEMP/tether-update.tar.gz"
          echo 'f0704ad93ef67fe7c81f0ad470136bb9aea1e2648381a6209066d43579e46e7b  '"$RUNNER_TEMP/tether-update.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/tether-update.tar.gz"
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build:pages
      - name: Publish reviewed source and interface
        run: |
          git config user.name 'Leo Lune'
          git config user.email '258829717+leolunelove@users.noreply.github.com'
          git add app lib db drizzle package.json README.md .gitignore .gitattributes tests guides docs
          git commit -m 'Add recovery, reliable pairing, deletion, and beta safeguards'
          git push origin HEAD:main
